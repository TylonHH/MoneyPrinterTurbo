captainVersion: 4

services:
  $$cap_appname:
    image: ghcr.io/tylonhh/moneyprinterturbo:$$cap_mpt_version
    restart: unless-stopped
    volumes:
      - $$cap_appname-data:/persistent
    caproverExtra:
      containerHttpPort: '8501'

  $$cap_appname-api:
    image: ghcr.io/tylonhh/moneyprinterturbo:$$cap_mpt_version
    restart: unless-stopped
    volumes:
      - $$cap_appname-data:/persistent
    command: python3 main.py
    caproverExtra:
      notExposeAsWebApp: 'true'

caproverOneClickApp:
  variables:
    - id: $$cap_mpt_version
      label: MoneyPrinterTurbo image tag
      defaultValue: voicebox
      description: Custom MoneyPrinterTurbo image with Voicebox integration and automatic persistent config/storage handling.
      validRegex: /^([^\s\/])+$/

  instructions:
    start: |-
      Deploy the Voicebox-enabled MoneyPrinterTurbo image on CapRover.

      This template creates:
      - a public Streamlit WebUI on port 8501
      - an internal API service on port 8080
      - one shared persistent volume mounted at /persistent

      The custom image automatically maps:
      - /MoneyPrinterTurbo/config.toml -> /persistent/config.toml
      - /MoneyPrinterTurbo/storage -> /persistent/storage

      Configure Voicebox credentials as environment variables on the services that need TTS:
      - VOICEBOX_AUTH_USERNAME
      - VOICEBOX_AUTH_PASSWORD

    end: |-
      MoneyPrinterTurbo is deployed at http://$$cap_appname.$$cap_root_domain

      Recommended next steps:
      1. Enable HTTPS for $$cap_appname in CapRover.
      2. Enable WebSocket support for the Streamlit WebUI.
      3. Configure provider API keys in the WebUI; they are persisted in /persistent/config.toml.
      4. The internal API service is available as srv-captain--$$cap_appname-api:8080.

      The named volume $$cap_appname-data preserves configuration, API keys and generated/downloaded media across image updates.

  displayName: MoneyPrinterTurbo + Voicebox
  isOfficial: false
  description: Self-hosted AI short-video generator with Voicebox TTS, persistent configuration/storage, WebUI and internal API.
  documentation: https://github.com/TylonHH/MoneyPrinterTurbo
