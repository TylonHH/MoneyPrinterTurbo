name: Build Voicebox-enabled image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.voicebox"
      - "patches/**"
      - ".github/workflows/build-voicebox-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.voicebox
          push: true
          tags: |
            ghcr.io/tylonhh/moneyprinterturbo:voicebox
            ghcr.io/tylonhh/moneyprinterturbo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=MoneyPrinterTurbo with native self-hosted Voicebox TTS support
